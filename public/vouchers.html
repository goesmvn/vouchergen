<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher Details - Batur Hot Spring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 flex flex-col items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-slate-800">Your E-Voucher</h2>
      <p class="text-slate-500 text-sm mt-1">Show the QR code below at the entrance counter</p>
    </div>

    <!-- Voucher Details -->
    <div id="voucher-details" class="bg-slate-50 rounded-xl p-4 border border-slate-150 space-y-3 hidden">
      <div class="flex justify-between border-b border-slate-200 pb-2">
        <span class="text-slate-500 text-xs font-semibold uppercase">Guest Name</span>
        <span id="cust-name" class="text-slate-800 font-bold text-sm"></span>
      </div>
      <div class="flex justify-between border-b border-slate-200 pb-2">
        <span class="text-slate-500 text-xs font-semibold uppercase">Visit Date</span>
        <span id="visit-date" class="text-slate-800 font-bold text-sm"></span>
      </div>
      <div class="flex justify-between border-b border-slate-200 pb-2">
        <span class="text-slate-500 text-xs font-semibold uppercase">Voucher Code</span>
        <span id="voucher-code-text" class="text-slate-800 font-mono font-bold text-sm"></span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500 text-xs font-semibold uppercase">Status</span>
        <span id="voucher-status" class="px-2 py-0.5 rounded text-xs font-bold"></span>
      </div>
    </div>

    <!-- Sibling/Ticket Items List -->
    <div id="items-container" class="space-y-4"></div>

    <div id="error-message" class="text-center text-red-500 font-bold hidden">Voucher not found or unpaid.</div>
    <div id="loading" class="text-center text-slate-500">Loading voucher details...</div>
  </div>

  <script>
    async function loadVoucher() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (!code) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-message').innerText = 'Voucher code is empty.';
        document.getElementById('error-message').classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/vouchers/' + code);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        
        document.getElementById('loading').classList.add('hidden');

        // Check if invoice/voucher is paid or redeemed
        if (data.status !== 'Paid' && data.status !== 'Redeemed') {
          document.getElementById('error-message').innerText = 'This voucher has not been fully paid or confirmed.';
          document.getElementById('error-message').classList.remove('hidden');
          return;
        }

        document.getElementById('voucher-details').classList.remove('hidden');
        document.getElementById('cust-name').innerText = data.customer_name;
        document.getElementById('visit-date').innerText = data.visit_date || '—';
        document.getElementById('voucher-code-text').innerText = data.voucher_code;
        
        const statusEl = document.getElementById('voucher-status');
        if (data.redeemed) {
          statusEl.innerText = 'REDEEMED (SCANNED)';
          statusEl.className = 'px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700';
        } else {
          statusEl.innerText = 'ACTIVE (NOT SCANNED)';
          statusEl.className = 'px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700';
        }

        // Render QR code for each item
        const itemsContainer = document.getElementById('items-container');
        itemsContainer.innerHTML = '';

        data.items.forEach((item, index) => {
          const itemCode = `${data.voucher_code}-${index + 1}`;
          
          const card = document.createElement('div');
          card.className = 'bg-slate-50 rounded-xl p-4 border border-slate-200 flex flex-col items-center space-y-4';
          
          const itemTitle = document.createElement('h3');
          itemTitle.className = 'text-sm font-bold text-slate-800 text-center';
          itemTitle.innerText = `${item.ticket_title} (${item.quantity} Pcs)`;
          card.appendChild(itemTitle);

          const qrWrapper = document.createElement('div');
          qrWrapper.className = 'bg-white p-2 border border-slate-200 rounded-lg';
          const qrDiv = document.createElement('div');
          qrWrapper.appendChild(qrDiv);
          card.appendChild(qrWrapper);

          const codeLabel = document.createElement('span');
          codeLabel.className = 'text-xs text-slate-500 font-mono';
          codeLabel.innerText = itemCode;
          card.appendChild(codeLabel);

          itemsContainer.appendChild(card);

          // Generate QR Code inside div
          new QRCode(qrDiv, {
            text: itemCode,
            width: 160,
            height: 160
          });
        });

      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-message').classList.remove('hidden');
      }
    }
    loadVoucher();
  </script>
</body>
</html>
