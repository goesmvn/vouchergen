services:
  voucher-generator:
    build: .
    container_name: voucher-generator
    restart: always
    ports:
      - "3005:3000"
    environment:
      - DB_PATH=/data/database.sqlite
      - CHATBOT_URL=http://chatbot:5000
    volumes:
      - voucher-data:/data
    depends_on:
      - chatbot
    networks:
      - default
      - dokploy-network

  chatbot:
    build:
      context: ./chatbot
    container_name: voucher-chatbot
    restart: always
    ports:
      - "5001:5000"
    environment:
      - DB_PATH=/data/database.sqlite
      - GENERATOR_URL=http://voucher-generator:3000
      - WAHA_URL=http://waha:3000
    networks:
      - default

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: always
    ports:
      - "3006:3000"
    environment:
      - WAHA_WEBHOOKS_1_EVENTS=message,message.any
      - WAHA_WEBHOOKS_1_URL=http://voucher-generator:3000/api/whatsapp/webhook
      - WAHA_WEBHOOKS_1_SESSION=default
    volumes:
      - waha-session:/app/.sessions
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  voucher-data:
  waha-session:

