services:
  voucher-generator:
    build: .
    container_name: voucher-generator
    restart: always
    ports:
      - "3005:3000"
    environment:
      - DB_PATH=/data/database.sqlite
    volumes:
      - voucher-data:/data
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  voucher-data:

